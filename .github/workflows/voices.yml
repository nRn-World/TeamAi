name: Generate voices
# Renders the game's spoken lines with the free Kokoro speech model and stores the clips in public/voice/.
on:
  push:
    branches: ['arena/**']
    paths: ['voice/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install kokoro-onnx==0.4.9 imageio-ffmpeg
      - name: Download the Kokoro model (Apache-2.0)
        run: |
          mkdir -p /tmp/kokoro && cd /tmp/kokoro
          curl -fsSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: python voice/make.py /tmp/kokoro
      - name: Save the clips in the project
        if: always()
        run: |
          # commit as the person who pushed, so that Vercel accepts the commit for its preview build
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git add -A public/voice
          git diff --cached --quiet || (git commit -m "Generated voice clips [skip ci]" && git push)
