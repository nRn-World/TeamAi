name: AI model check
# Checks the speech and order-reading models the game downloads in the player's browser. Posts the result as a comment on the commit.
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['tools/check-ai.mts', 'src/sim/aiorders.ts', '.github/workflows/ai-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsx tools/check-ai.mts || true
      - name: Comment on the commit
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          test -f ai-check.txt || echo "no output" > ai-check.txt
          { echo '```'; head -c 60000 ai-check.txt; echo; echo '```'; } > body.txt
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.txt
